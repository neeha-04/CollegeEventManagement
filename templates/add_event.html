{% extends "base.html" %}

{% block title %}Add Event - College Events{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title mb-0">
                    <i data-feather="plus" class="me-2"></i>
                    Add New Event
                </h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="name" class="form-label">Event Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="prize" class="form-label">Prize Money</label>
                            <input type="text" class="form-control" id="prize" name="prize" placeholder="e.g., ₹10,000" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="registration_fee" class="form-label">Registration Fee</label>
                            <input type="number" class="form-control" id="registration_fee" name="registration_fee" min="0" step="0.01" placeholder="e.g., 100" required>
                            <div class="form-text">Enter 0 for free events</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="rules" class="form-label">Rules & Regulations</label>
                        <textarea class="form-control" id="rules" name="rules" rows="4" required></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="date" class="form-label">Date</label>
                            <input type="date" class="form-control" id="date" name="date" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="time" class="form-label">Time</label>
                            <input type="time" class="form-control" id="time" name="time" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="venue" class="form-label">Venue</label>
                            <input type="text" class="form-control" id="venue" name="venue" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="lead_name" class="form-label">Event Lead Name</label>
                            <input type="text" class="form-control" id="lead_name" name="lead_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lead_phone" class="form-label">Event Lead Phone</label>
                            <input type="tel" class="form-control" id="lead_phone" name="lead_phone" required>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i data-feather="save" class="me-2"></i>
                            Create Event
                        </button>
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">
                            <i data-feather="x" class="me-2"></i>
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
